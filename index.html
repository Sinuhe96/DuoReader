<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f4" />
    <meta
      name="description"
      content="DuoReader is an offline bilingual EPUB reader for BePub sentence pairs."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DuoReader" />
    <link rel="icon" href="icons/favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>DuoReader</title>
    <script>
      // Runs before the app bundle so the first paint already matches the
      // stored palette. Mirrors THEME_HINT_KEY and THEME_COLORS in
      // src/reader/settings.ts; the app rewrites both right after boot.
      try {
        const saved = localStorage.getItem('duoreader.theme');
        let palette = saved;
        if (palette !== 'light' && palette !== 'sepia' && palette !== 'dark') {
          palette = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.dataset.theme = palette;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute(
            'content',
            palette === 'sepia' ? '#f1e6d2' : palette === 'dark' ? '#171411' : '#faf8f4',
          );
      } catch {
        // Storage blocked: the bundle still applies the OS preference.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
